<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fog Mirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Mrs+Saint+Delafield&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="landing" class="landing">
    <div class="landing-content">
      <h1 class="title">Fog Mirror</h1>
      <p class="byline">by Amber</p>
      <p class="subtitle">Uses your camera and microphone.</p>
      <button id="start-btn" class="start-btn" type="button">Start</button>
    </div>
  </main>

  <section id="mirror" class="mirror hidden">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="fog"></canvas>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
