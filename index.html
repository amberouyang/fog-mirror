<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fog Mirror</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="landing" class="landing">
    <div class="landing-content">
      <h1 class="title">Fog Mirror<svg class="title-heart" viewBox="0 0 48 56" aria-hidden="true">
          <path d="M24 36C15 29 7 23 7 15C7 9.5 11 5.5 16 5.5C20 5.5 22.5 8.5 24 12C25.5 8.5 28 5.5 32 5.5C37 5.5 41 9.5 41 15C41 23 33 29 24 36C20 39 16 41 13 44C10 47 10.5 51 14 51C17.5 51 18.5 47 16 45.5C13.5 44 9 46.5 6 52" />
        </svg></h1>
      <p class="byline">by Amber</p>
      <p class="subtitle">Uses your camera and microphone.</p>
      <button id="start-btn" class="start-btn" type="button">Start</button>
    </div>
  </main>

  <section id="mirror" class="mirror hidden">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="fog"></canvas>
    <div id="cursors" class="cursors"></div>
    <p id="hint" class="hint"></p>
    <div id="breath-meter" class="breath-meter" title="Breath">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7" />
      </svg>
      <div class="breath-track"><div id="breath-level" class="breath-level"></div></div>
    </div>
    <button id="snapshot-btn" class="snapshot-btn" type="button" aria-label="Take a photo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.4-2h5l1.4 2h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z" />
        <circle cx="12" cy="12.5" r="3.5" />
      </svg>
    </button>
    <div id="flash" class="flash"></div>
    <label class="brush-control">
      <span class="brush-label">Brush</span>
      <input id="brush-size" type="range" min="6" max="80" value="22" aria-label="Brush size" />
      <span class="brush-preview-box"><span id="brush-preview" class="brush-preview"></span></span>
    </label>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
